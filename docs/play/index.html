<!doctype html>
<html lang="en" data-state="boot">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CatSynth 64 &middot; play in the browser</title>
<meta name="description" content="CatSynth 64, a groovebox for the Commodore 64 by illobo/netmilk: play it in the browser.">
<link rel="preload" href="c64.wasm" as="fetch" type="application/wasm" crossorigin>
<!--
  CatSynth 64 1.0 by illobo/netmilk (MIT), on floooh's C64 emulator from chips/chips-test
  (zlib and MIT, LICENSE-chips.txt and LICENSE-chips-test.txt; c64.js and c64.wasm are the published tiny8bit build).
  The emulator has no 1351 mouse: this page writes the browser mouse into CatSynth's own click mailbox
  (ui.asm mouse_fake) in the emulated RAM. Generated by tools/site.py.
-->
<style>
  :root { --c64-blue: #352879; --c64-light: #6c5eb5; --ink: #f4efe6; --hint: #a39ad6; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--ink); overflow: hidden;
    font: 14px/1.3 ui-monospace, "SF Mono", Menlo, monospace; }
  .stage { position: absolute; inset: 0; display: flex; flex-direction: column; }
  /* the emulator letterboxes the PAL frame in its canvas; the canvas runs 24 px below the box so the
     emulator's own status line stays out of sight */
  .screen { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; }
  #canvas { position: absolute; left: 0; top: 0; width: 100%; height: calc(100% + 24px); display: block; outline: none;
    image-rendering: pixelated; cursor: none; }
  .hint { flex: 0 0 auto; padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); text-align: center; color: var(--hint);
    background: #000; font-size: 13px; letter-spacing: .02em; }
  .hint kbd { display: inline-block; min-width: 1.6em; padding: 1px 6px; margin: 0 2px; border: 1px solid var(--c64-light);
    border-bottom-width: 3px; border-radius: 4px; color: var(--ink); font: inherit; text-align: center; }
  .btn { position: absolute; z-index: 3; top: calc(10px + env(safe-area-inset-top)); height: 32px; padding: 0 14px;
    border: 0; border-radius: 16px; background: rgba(53, 40, 121, .85); color: var(--ink);
    font: 700 12px/32px ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .1em; cursor: pointer; }
  .close { right: calc(10px + env(safe-area-inset-right)); }
  .sound { left: calc(10px + env(safe-area-inset-left)); }
  .sound.off { color: var(--hint); text-decoration: line-through; }
  .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .boot { position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; background: var(--c64-blue);
    color: var(--c64-light); font-size: 15px; letter-spacing: .08em; transition: opacity .3s; }
  html:not([data-state="boot"]) .boot { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div class="stage">
  <div class="screen">
    <canvas id="canvas" tabindex="0" aria-label="CatSynth 64, the Commodore 64 screen" oncontextmenu="event.preventDefault()"></canvas>
    <div class="boot" aria-hidden="true">LOAD"CATSYNTH64",8,1</div>
  </div>
  <p class="hint">mouse: move, left / right click &middot; <kbd>Space</kbd> play / stop &middot; <kbd>1</kbd>-<kbd>0</kbd> style
    &middot; arrows + <kbd>Return</kbd> edit &middot; <kbd>Esc</kbd> RUN/STOP (help, back) &middot;
    <a href="../tutorial.html" style="color:inherit">tutorial</a></p>
</div>
<button class="btn close" type="button" aria-label="Back to the website">BACK</button>
<button class="btn sound" type="button" aria-label="Sound on / off" aria-pressed="false">SOUND</button>
<script>
(function () {
  'use strict';
  var CFG = { mx: 28704, my: 28706, fake: 28715, sig: [[28671, [173,43,112,240,27,162,0,142,43,112,72,169,1,141,42,112,32,132,111,32,208,111,104,201]], [28716, [141,136,117,32,189,111,142,137,117,165,219,240,3,76,117,138,173,220,173,240,3,76,163,161]]] };
  var TITLE = document.title, html = document.documentElement;

  // the emulator's arguments, read from the address: the program, RUN typed at READY (no joystick on the
  // keys: CatSynth needs the arrows and SPACE as keys)
  if (!/[?&]file=/.test(location.search)) history.replaceState(null, '', location.pathname + '?file=catsynth64.prg&input=RUN%0A');

  document.querySelector('.close').addEventListener('click', function () { location.href = '../'; });

  // --- sound: a gain in front of every AudioContext's destination, so the button mutes without touching the
  // emulator; the choice is kept ---
  var KEY_SOUND = 'catsynth64.sound', soundOn = true, gains = [];
  try { soundOn = localStorage.getItem(KEY_SOUND) !== 'off'; } catch (e) {}
  var Native = window.AudioContext || window.webkitAudioContext;
  if (Native) {
    var realDest = Object.getOwnPropertyDescriptor(Native.prototype, 'destination') ||
      Object.getOwnPropertyDescriptor(Object.getPrototypeOf(Native.prototype), 'destination');
    var Wrapped = function (opts) {
      var ctx = new Native(opts), g = ctx.createGain();
      g.gain.value = soundOn ? 1 : 0;
      g.connect(realDest.get.call(ctx));
      Object.defineProperty(ctx, 'destination', { get: function () { return g; } });
      gains.push(g);
      return ctx;
    };
    Wrapped.prototype = Native.prototype;
    window.AudioContext = Wrapped;
    if (window.webkitAudioContext) window.webkitAudioContext = Wrapped;
  }
  var soundBtn = document.querySelector('.sound');
  function showSound() { soundBtn.setAttribute('aria-pressed', String(!soundOn)); soundBtn.classList.toggle('off', !soundOn); }
  soundBtn.addEventListener('click', function () {
    soundOn = !soundOn;
    gains.forEach(function (g) { g.gain.value = soundOn ? 1 : 0; });
    try { localStorage.setItem(KEY_SOUND, soundOn ? 'on' : 'off'); } catch (e) {}
    showSound();
    try { canvas.focus({ preventScroll: true }); } catch (e) {}
  });
  showSound();

  // --- the emulator ---
  var canvas = document.getElementById('canvas');
  window.Module = {
    canvas: canvas,
    print: function () {},
    printErr: function (t) { if (!/^(INFO|WARN)/.test(String(t))) console.warn(t); },
    onRuntimeInitialized: function () {
      setTimeout(function () {
        html.setAttribute('data-state', 'play'); document.title = TITLE;
        try { canvas.focus({ preventScroll: true }); } catch (e) {}
      }, 600);
      findRam();
    }
  };
  var s = document.createElement('script');
  s.src = 'c64.js'; s.async = true;
  s.onerror = function () { document.querySelector('.boot').textContent = '?LOAD ERROR'; };
  document.body.appendChild(s);

  // --- the mouse: CatSynth's click mailbox in the C64's RAM. The RAM is found in the emulator's heap by two
  // pieces of CatSynth's code at their addresses (both must agree); until the program has unpacked itself
  // there is nothing to find, so it looks again every second. ---
  var ram = -1;
  function heap() { return window.Module && window.Module.HEAPU8; }
  function matchAt(h, base, sig) {
    var a = base + sig[0], b = sig[1];
    for (var k = 0; k < b.length; k++) if (h[a + k] !== b[k]) return false;
    return true;
  }
  function findRam() {
    var h = heap();
    if (h) {
      var s0 = CFG.sig[0], first = s0[1][0], n = h.length - 65536;
      for (var i = 0; i < h.length; i++) {
        if (h[i] !== first) continue;
        var base = i - s0[0];
        if (base < 0 || base > n) continue;
        if (matchAt(h, base, s0) && matchAt(h, base, CFG.sig[1])) { ram = base; return; }
      }
    }
    setTimeout(findRam, 1000);
  }
  // the pointer moves with the mouse's movement (like a real mouse on a C64): one C64 pixel per screen pixel
  // of the letterboxed 392 x 272 picture
  var fx = 0, fy = 0, pending = 0, raf = 0;
  function scale() {
    var w = canvas.clientWidth, h = canvas.clientHeight - 24;
    return Math.max(0.5, Math.min(w / 392, h / 272));
  }
  function poke(kind) {
    var h = heap();
    if (ram < 0 || !h) return;
    var x = h[ram + CFG.mx] | h[ram + CFG.mx + 1] << 8, y = h[ram + CFG.my];
    var k = scale(), dx = Math.trunc(fx / k), dy = Math.trunc(fy / k);
    fx -= dx * k; fy -= dy * k;
    x = Math.max(0, Math.min(319, x + dx)); y = Math.max(0, Math.min(199, y + dy));
    h[ram + CFG.mx] = x & 255; h[ram + CFG.mx + 1] = x >> 8; h[ram + CFG.my] = y;
    h[ram + CFG.fake] = kind;
  }
  canvas.addEventListener('mousemove', function (e) {
    fx += e.movementX || 0; fy += e.movementY || 0;
    if (!raf) raf = requestAnimationFrame(function () { raf = 0; if (!pending) poke(3); });
  });
  canvas.addEventListener('mousedown', function (e) {
    try { canvas.focus({ preventScroll: true }); } catch (err) {}
    if (e.button === 0 || e.button === 2) {
      pending = 1;
      poke(e.button === 0 ? 1 : 2);
      setTimeout(function () { pending = 0; }, 40);   // two frames: the click is read before the next move
    }
    e.preventDefault();
  });
})();
</script>
</body>
</html>
